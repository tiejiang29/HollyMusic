# ============================================================================
# HollyMusic Docker 部署示例（直接使用 Docker Hub 预构建镜像）
#
# 用法：
#   1. mkdir holly-music && cd holly-music
#   2. 将本文件复制为 docker-compose.yml（或在部署目录直接下载：
#      curl -o docker-compose.yml \
#        https://raw.githubusercontent.com/tiejiang29/HollyMusic/main/docker-compose.example.yml）
#   3. 创建 .env（最小配置只需 AUTH_SECRET，生成：openssl rand -hex 32）
#   4. docker compose up -d，访问 http://localhost:3099
#
# 想固定版本？把 image 的 :latest 换成具体 tag（如 :1.0.0），
# 可用 tag 见 https://hub.docker.com/r/tiejiang29/hollymusic/tags
#
# 注：仓库根目录的 docker-compose.yml 是本地源码构建版（build: .），
#     适合开发调试；本文件面向直接使用镜像部署的用户。
# ============================================================================

services:
  app:
    image: tiejiang29/hollymusic:latest
    container_name: holly-music
    ports:
      - "3099:3000"
    # 鉴权密钥等敏感配置放 .env（AUTH_SECRET 必填，≥32 位随机字符串）
    # environment 中的同名变量优先级更高，会覆盖 env_file
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/data/music.db
      # 边听边下：cache=下载中转区，library=持久音乐库（歌手/专辑两级目录）。
      # 两者必须在同一卷（./data）下，入库时 rename 原子移动。
      - ENABLE_FILE_CACHE=true
      - AUDIO_CACHE_DIR=/app/data/cache
      # 音乐库配额（GB）：满了停止入库并提示，播放不受影响；0 不建议
      - AUDIO_LIBRARY_DIR=/app/data/library
      - AUDIO_LIBRARY_QUOTA_GB=20
    volumes:
      # 音源脚本（运行时数据：后台上传/管理的音源脚本，热重载生效）
      - ./custom-sources:/app/custom-sources
      # music-sources.json 等运行时配置
      - ./config:/app/config
      # SQLite 数据库持久化（重要！首次启动自动建库并运行迁移）
      - ./prisma_data:/app/prisma/prisma/data
      # 边听边下单卷双目录：cache（下载中转）+ library（持久音乐库正本）。
      # 旧版 ./cache_data 用户可整体迁移：mv cache_data data/cache（或软链兼容）
      - ./data:/app/data
      # 日志（可选）
      - ./app_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
