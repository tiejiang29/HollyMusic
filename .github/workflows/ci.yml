name: CI

# 代码质量门禁 + Docker Hub 镜像发布，**合在一条 workflow 里，用 needs 串起来**。
#
# 为什么合：原来 CI 与 Build & Push 是两条并列的 workflow，各自被 push 触发、互不引用
# —— 于是测试红了镜像照样发。2026-10-05 实测坐实：`CI #57` failure，同一 commit 的
# `#70` success 并把 latest 推上了 Docker Hub。别指望"给 build 加 needs: check"能解决：
# **`needs` 只能引用同一文件内的 job，跨 workflow 无效**。所以把发布 job 搬进来。
# （分支保护里的 required check 只拦 PR 合并，我们直推 main，那条保护从来拦不住发布。）
#
# ghcr.io 那条（docker-publish.yml，tag → 镜像 → GitHub Release）不在这条链上，没动它。
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Prisma Client 实例化即读取 DATABASE_URL；SQLite file: 路径无需真实库文件，
      # 单测与构建均不做真实连接（与 Docker 多阶段构建行为一致）
      DATABASE_URL: file:./prisma/data/music.db
      # 签名密钥缺失仅告警并回退开发 fallback，单测/构建无需真实值
      AUTH_SECRET: ci-dummy-secret-not-for-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 版本锁定在 package.json 的 packageManager 字段，action 自动读取
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          # 根目录与 frontend/ 各有一份 lockfile，都纳入缓存 key
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies (root + frontend)
        run: |
          pnpm install --frozen-lockfile
          pnpm -C frontend install --frozen-lockfile

      # @prisma/client 为生成式产物，typecheck / test / build 前必须先生成
      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: |
          pnpm test
          pnpm -C frontend test

      - name: Build
        run: |
          pnpm build
          pnpm -C frontend build

  # Docker Hub 发布（NAS 拉的就是这个镜像）。steps 原样搬自旧的 docker-build.yml，
  # 包括各 action 的版本号 —— 这次只加"先过 check"这一道，不顺手升依赖。
  build-and-push:
    # PR 不发布；只有 main 直推、tag、手动触发才走这一段
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: docker.io
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/hollymusic

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
